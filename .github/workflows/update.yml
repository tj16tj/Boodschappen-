name: Prijzen en bonus verversen

on:
  schedule:
    - cron: "30 6 * * *"   # elke dag 07:30 (winter) / 08:30 (zomer) Nederlandse tijd
  workflow_dispatch:        # handmatig starten via het tabblad Actions
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Data ophalen
        run: python scripts/update_data.py

      - name: Bonus en status bewaren in de repo
        run: |
          git config user.name "boodschappen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bonus.json data/status.json data/debug || true
          git diff --cached --quiet || git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
          git push || echo "push mislukt, ga toch door met publiceren"

      - name: Site samenstellen
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/prices.json data/bonus.json data/status.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
